<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educa-prenatal | Mis Sesiones</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6d0f1f;
            --primary-light: #a82036;
            --accent: #f1a7b0;
            --white-glow: rgba(255, 255, 255, 0.2);
            --text-dark: #333;
        }

        body {
            background: var(--primary);
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            color: white;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 50px;
        }

        /* Fondo Animado */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            z-index: 1;
            pointer-events: none;
        }
        .c1 { width: 500px; height: 500px; top: -150px; left: -100px; animation: move 20s infinite alternate; }
        .c2 { width: 300px; height: 300px; bottom: -50px; right: -50px; animation: move 15s infinite alternate-reverse; }
        @keyframes move { to { transform: translate(60px, 100px); } }

        .container-custom {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            flex-wrap: wrap;
            gap: 20px;
        }

        .sessions-panel {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            color: var(--text-dark);
        }

        .panel-title {
            color: var(--primary);
            font-weight: 600;
            text-align: center;
            margin-bottom: 40px;
        }

        .session-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #eee;
            height: 100%;
        }

        .session-card:not(.locked):hover {
            transform: translateY(-10px);
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .session-card.locked {
            background: #e9ecef;
            color: #adb5bd;
            cursor: not-allowed;
            border: 2px dashed #dee2e6;
        }

        .lock-icon { font-size: 2rem; margin-bottom: 10px; }

        .btn-query-nav {
            background: var(--accent);
            color: var(--primary) !important;
            font-weight: 600;
            border-radius: 15px;
            padding: 12px 20px;
            transition: 0.3s;
            border: none;
        }

        .btn-query-nav:hover {
            background: white;
            transform: scale(1.05);
        }

        /* Estilos del Historial de Consultas */
        .query-item {
            border-bottom: 1px solid #f0f0f0;
            padding: 20px 0;
        }
        .query-question {
            background: #fdf2f4;
            padding: 12px 18px;
            border-radius: 18px 18px 18px 0;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #555;
            display: inline-block;
            max-width: 90%;
        }
        .query-answer {
            background: #f1f3f5;
            padding: 12px 18px;
            border-radius: 18px 18px 0 18px;
            margin-left: auto;
            font-size: 0.95rem;
            border-left: 4px solid var(--primary);
            color: #333;
            max-width: 90%;
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="circle c1"></div>
    <div class="circle c2"></div>

    <div class="container container-custom">
        <header class="header-box text-white">
            <div class="text-start">
                <h1 class="display-5 fw-bold mb-0">Bienvenida ✨</h1>
                <p id="userMsg" class="lead opacity-75">Cargando tu progreso...</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-query-nav shadow-sm" data-bs-toggle="modal" data-bs-target="#modalQueries">
                    💬 Mis Consultas
                </button>
                <a href="index.html" class="btn btn-outline-light d-flex align-items-center" style="border-radius: 15px; padding: 0 20px;">
                    Cerrar Sesión
                </a>
            </div>
        </header>

        <main class="sessions-panel">
            <h2 class="panel-title">Tu Programa Prenatal Digital</h2>
            <div class="row g-4" id="sessionsGrid">
                <!-- Se carga vía JS -->
            </div>
        </main>
    </div>

    <!-- MODAL DE CENTRO DE CONSULTAS -->
    <div class="modal fade" id="modalQueries" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content text-dark" style="border-radius: 25px;">
                <div class="modal-header border-0 pb-0" style="padding: 25px;">
                    <h5 class="modal-title fw-bold" style="color: var(--primary);">Centro de Consultas ✨</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="padding: 25px;">
                    <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active px-4" id="btn-tab-hist" data-bs-toggle="pill" data-bs-target="#tab-history" style="border-radius: 12px;">Mis Dudas</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link px-4" data-bs-toggle="pill" data-bs-target="#tab-new" style="border-radius: 12px;">Nueva Consulta</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Pestaña Historial -->
                        <div class="tab-pane fade show active" id="tab-history">
                            <div id="queriesList" style="max-height: 400px; overflow-y: auto; padding-right: 10px;">
                                <div class="text-center py-5">
                                    <div class="spinner-border text-danger" role="status"></div>
                                    <p class="mt-2 text-muted">Cargando tus dudas...</p>
                                </div>
                            </div>
                        </div>

                        <!-- Pestaña Nueva -->
                        <div class="tab-pane fade" id="tab-new">
                            <div class="bg-light p-4 rounded-4">
                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-uppercase text-muted">Asunto</label>
                                    <input type="text" id="querySubject" class="form-control border-0 shadow-sm" placeholder="Ej: Duda con ejercicios de respiración" style="border-radius: 10px; padding: 12px;">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-uppercase text-muted">Tu Mensaje</label>
                                    <textarea id="queryMessage" class="form-control border-0 shadow-sm" rows="4" placeholder="Escribe aquí tu pregunta detallada..." style="border-radius: 10px; padding: 12px; resize: none;"></textarea>
                                </div>
                                <button class="btn btn-danger w-100 py-3 shadow" id="btnSendQuery" style="background: var(--primary); border:none; border-radius:15px; font-weight: 600;">
                                    Enviar Consulta al Admin
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQXNj667woEMLUphhlHCAFeoAhEY0IuNM",
            authDomain: "educa-prenatal.firebaseapp.com",
            projectId: "educa-prenatal",
            storageBucket: "educa-prenatal.firebasestorage.app",
            messagingSenderId: "474992751698",
            appId: "1:474992751698:web:f313f8def5ff266a45b8b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const sessionsGrid = document.getElementById("sessionsGrid");
        const queriesList = document.getElementById("queriesList");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadUserData(user);
                listenToQueries(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        async function loadUserData(user) {
            try {
                const q = query(collection(db, "users"), where("uid", "==", user.uid));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    const userData = snap.docs[0].data();
                    const nivel = userData.nivelDesbloqueado || 1;
                    document.getElementById("userMsg").innerText = `¡Hola, ${userData.nombre || 'Mamita'}! Tienes ${Math.min(nivel, 8)} de 8 sesiones desbloqueadas.`;
                    renderDashboard(nivel);
                }
            } catch (e) { console.error(e); }
        }

        function renderDashboard(nivel) {
            sessionsGrid.innerHTML = "";
            for (let i = 1; i <= 8; i++) {
                const isLocked = i > nivel;
                const col = document.createElement("div");
                col.className = "col-6 col-md-4 col-lg-3";
                col.innerHTML = `
                    <div class="session-card ${isLocked ? 'locked' : ''}">
                        <div class="lock-icon">${isLocked ? '🔒' : '🔓'}</div>
                        <div class="small text-uppercase opacity-75">Módulo</div>
                        <div class="h4 fw-bold">Sesión ${i}</div>
                    </div>`;
                if (!isLocked) col.querySelector('.session-card').onclick = () => window.location.href = `sesion_detalle.html?id=${i}`;
                sessionsGrid.appendChild(col);
            }
        }

        // --- SISTEMA DE CONSULTAS EN TIEMPO REAL ---
        function listenToQueries(uid) {
            // Consulta simple para evitar problemas de índices
            const q = query(collection(db, "queries"), where("uid", "==", uid));

            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    queriesList.innerHTML = `
                        <div class="text-center py-5">
                            <p class="text-muted">No has realizado ninguna consulta aún.</p>
                        </div>`;
                    return;
                }

                let items = [];
                snapshot.forEach(doc => items.push({id: doc.id, ...doc.data()}));
                
                // Ordenar por fecha manualmente (descendente)
                items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                queriesList.innerHTML = "";
                items.forEach(data => {
                    const div = document.createElement("div");
                    div.className = "query-item";
                    div.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold" style="color: var(--primary);">${data.subject || 'Sin Asunto'}</span>
                            <span class="status-badge ${data.reply ? 'bg-success text-white' : 'bg-warning text-dark'}">
                                ${data.reply ? 'Respondido' : 'Pendiente'}
                            </span>
                        </div>
                        <div class="d-flex flex-column gap-2">
                            <div class="query-question">${data.message}</div>
                            ${data.reply ? `<div class="query-answer"><strong>Respuesta:</strong><br>${data.reply}</div>` : ''}
                        </div>
                    `;
                    queriesList.appendChild(div);
                });
            });
        }

        document.getElementById("btnSendQuery").addEventListener("click", async () => {
            const user = auth.currentUser;
            const subject = document.getElementById("querySubject").value.trim();
            const message = document.getElementById("queryMessage").value.trim();

            if (!subject || !message) return alert("Por favor escribe un asunto y tu mensaje.");

            try {
                document.getElementById("btnSendQuery").disabled = true;
                document.getElementById("btnSendQuery").innerText = "Enviando...";

                await addDoc(collection(db, "queries"), {
                    uid: user.uid,
                    userName: user.displayName || "Usuario",
                    userEmail: user.email,
                    subject: subject,
                    message: message,
                    reply: null,
                    status: "Pendiente",
                    createdAt: serverTimestamp()
                });

                document.getElementById("querySubject").value = "";
                document.getElementById("queryMessage").value = "";
                
                // Volver a la pestaña de historial
                const tabHist = new bootstrap.Tab(document.getElementById('btn-tab-hist'));
                tabHist.show();

            } catch (e) {
                alert("Error al enviar. Inténtalo de nuevo.");
            } finally {
                document.getElementById("btnSendQuery").disabled = false;
                document.getElementById("btnSendQuery").innerText = "Enviar Consulta al Admin";
            }
        });
    </script>
</body>
</html>
