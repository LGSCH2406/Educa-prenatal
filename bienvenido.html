<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educa-prenatal | Mis Sesiones</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6d0f1f;
            --primary-light: #a82036;
            --accent: #f1a7b0;
            --white-glow: rgba(255, 255, 255, 0.2);
        }

        body {
            background: var(--primary);
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            color: white;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 50px;
        }

        /* Fondo Animado */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            z-index: 1;
            pointer-events: none;
        }
        .c1 { width: 500px; height: 500px; top: -150px; left: -100px; animation: move 20s infinite alternate; }
        .c2 { width: 300px; height: 300px; bottom: -50px; right: -50px; animation: move 15s infinite alternate-reverse; }
        @keyframes move { to { transform: translate(60px, 100px); } }

        .container-custom {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* Header mejorado con Bootstrap */
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Panel de Sesiones Blanco */
        .sessions-panel {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            color: #333;
        }

        .panel-title {
            color: var(--primary);
            font-weight: 600;
            text-align: center;
            margin-bottom: 40px;
        }

        /* Cards de Sesiones */
        .session-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #eee;
            height: 100%;
        }

        .session-card:not(.locked):hover {
            transform: translateY(-10px);
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .session-card.locked {
            background: #e9ecef;
            color: #adb5bd;
            cursor: not-allowed;
            border: 2px dashed #dee2e6;
        }

        .lock-icon { font-size: 2rem; margin-bottom: 10px; }

        /* Estilos específicos para el Modal (Bootstrap usa sus clases, esto es refuerzo) */
        .modal-content {
            border-radius: 25px;
            border: none;
        }
        .modal-header {
            background: var(--primary);
            color: white;
            border-radius: 25px 25px 0 0;
        }
        .btn-primary-custom {
            background: var(--primary);
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
        }
        .btn-primary-custom:hover { background: var(--primary-light); }

        .btn-query-nav {
            background: var(--accent);
            color: var(--primary) !important;
            font-weight: 600;
            border-radius: 15px;
            padding: 12px 20px;
            transition: 0.3s;
        }
        .btn-query-nav:hover {
            background: white;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="circle c1"></div>
    <div class="circle c2"></div>

    <div class="container container-custom">
        <!-- HEADER CON BOTÓN DE CONSULTA VISIBLE -->
        <header class="header-box">
            <div class="text-start">
                <h1 class="display-5 fw-bold mb-0">Bienvenida ✨</h1>
                <p id="userMsg" class="lead opacity-75">Cargando tu progreso...</p>
            </div>
            <div class="d-flex gap-2">
                <!-- BOTÓN DE CONSULTA MUY VISIBLE -->
                <button class="btn btn-query-nav shadow-sm" data-bs-toggle="modal" data-bs-target="#modalQuery">
                    💬 Hacer una Consulta
                </button>
                <a href="index.html" class="btn btn-outline-light d-flex align-items-center" style="border-radius: 15px; padding: 0 20px;">
                    Cerrar Sesión
                </a>
            </div>
        </header>

        <!-- PANEL PRINCIPAL -->
        <main class="sessions-panel">
            <h2 class="panel-title">Tu Programa Prenatal Digital</h2>
            
            <div class="row g-4" id="sessionsGrid">
                <!-- Las sesiones se cargarán aquí -->
            </div>
        </main>
    </div>

    <!-- MODAL DE CONSULTAS (BOOTSTRAP 5) -->
    <div class="modal fade" id="modalQuery" tabindex="-1" aria-labelledby="modalQueryLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-dark">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalQueryLabel">¿Tienes alguna duda? ✨</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Escribe tu consulta y el administrador te responderá lo antes posible.</p>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Asunto</label>
                        <input type="text" id="querySubject" class="form-control" placeholder="Ej: Duda sobre la Sesión 1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tu Mensaje</label>
                        <textarea id="queryMessage" class="form-control" rows="4" placeholder="Cuéntanos en qué podemos ayudarte..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius: 12px;">Cancelar</button>
                    <button type="button" class="btn btn-primary-custom text-white" id="btnSendQuery">Enviar Consulta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQXNj667woEMLUphhlHCAFeoAhEY0IuNM",
            authDomain: "educa-prenatal.firebaseapp.com",
            projectId: "educa-prenatal",
            storageBucket: "educa-prenatal.firebasestorage.app",
            messagingSenderId: "474992751698",
            appId: "1:474992751698:web:f313f8def5ff266a45b8b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const sessionsGrid = document.getElementById("sessionsGrid");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const q = query(collection(db, "users"), where("uid", "==", user.uid));
                    const snap = await getDocs(q);
                    
                    if (!snap.empty) {
                        const userData = snap.docs[0].data();
                        const nivelDesbloqueado = userData.nivelDesbloqueado || 1;
                        
                        document.getElementById("userMsg").innerText = 
                            `¡Hola, ${userData.nombre || 'Mamita'}! Tienes ${Math.min(nivelDesbloqueado, 8)} de 8 sesiones desbloqueadas.`;
                        
                        renderDashboard(nivelDesbloqueado);
                    } else {
                        renderDashboard(1);
                        document.getElementById("userMsg").innerText = "¡Bienvenida! Comienza tu primera sesión.";
                    }
                } catch (error) {
                    console.error("Error al cargar datos:", error);
                    renderDashboard(1);
                }
            } else {
                window.location.href = "index.html";
            }
        });

        function renderDashboard(nivelDesbloqueado) {
            sessionsGrid.innerHTML = "";
            for (let i = 1; i <= 8; i++) {
                const isLocked = i > nivelDesbloqueado;
                
                const col = document.createElement("div");
                col.className = "col-6 col-md-4 col-lg-3";
                
                col.innerHTML = `
                    <div class="session-card ${isLocked ? 'locked' : ''}">
                        <div class="lock-icon">${isLocked ? '🔒' : '🔓'}</div>
                        <div class="small text-uppercase opacity-75">Módulo</div>
                        <div class="h4 fw-bold">Sesión ${i}</div>
                        <div class="small mt-2">${isLocked ? 'Bloqueado' : '¡Listo para ver!'}</div>
                    </div>
                `;

                if (!isLocked) {
                    col.querySelector('.session-card').onclick = () => window.location.href = `sesion_detalle.html?id=${i}`;
                }
                sessionsGrid.appendChild(col);
            }
        }

        // FUNCIONALIDAD DE CONSULTAS (MANTENIDA ✅)
        document.getElementById("btnSendQuery").addEventListener("click", async () => {
            const user = auth.currentUser;
            const subject = document.getElementById("querySubject").value.trim();
            const message = document.getElementById("queryMessage").value.trim();

            if (!subject || !message) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            try {
                const btn = document.getElementById("btnSendQuery");
                btn.innerText = "Enviando...";
                btn.disabled = true;

                await addDoc(collection(db, "queries"), {
                    uid: user.uid,
                    userName: user.displayName || "Usuario",
                    userEmail: user.email,
                    subject: subject,
                    message: message,
                    status: "Pendiente",
                    createdAt: serverTimestamp()
                });

                // Cerrar modal usando Bootstrap API
                const modalElement = document.getElementById('modalQuery');
                const modalInstance = bootstrap.Modal.getInstance(modalElement);
                modalInstance.hide();

                alert("¡Tu consulta ha sido enviada con éxito!");
                document.getElementById("querySubject").value = "";
                document.getElementById("queryMessage").value = "";
            } catch (e) {
                console.error(e);
                alert("Error al enviar la consulta.");
            } finally {
                document.getElementById("btnSendQuery").innerText = "Enviar Consulta";
                document.getElementById("btnSendQuery").disabled = false;
            }
        });
    </script>
</body>
</html>
