<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Detalle | Educa-prenatal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --fucsia: #d81b60;
            --fucsia-dark: #ad1457;
            --fucsia-light: #f06292;
            --white: #ffffff;
            --bg-soft: #fff5f8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-soft);
            margin: 0;
            padding: 0;
            color: #444;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(216, 27, 96, 0.08) 0%, transparent 35%),
                radial-gradient(circle at 100% 100%, rgba(216, 27, 96, 0.05) 0%, transparent 35%);
        }

        .header-bar {
            background: linear-gradient(135deg, var(--fucsia) 0%, var(--fucsia-dark) 100%);
            padding: 60px 20px 100px;
            color: white;
            border-radius: 0 0 60px 60px;
            box-shadow: 0 15px 40px rgba(173, 20, 87, 0.3);
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .logo-img {
            height: 180px;
            width: auto;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
            transition: transform 0.3s ease;
            margin-top: -20px;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
            color: white;
        }

        .session-info {
            margin-top: -30px;
        }

        .session-info h1 {
            font-size: 42px;
            margin: 0;
            font-weight: 600;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .main-content {
            transform: translateY(-60px);
            z-index: 10;
            position: relative;
        }

        .video-wrapper {
            background: var(--white);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
            border: 2px solid var(--white);
            margin-bottom: 30px;
        }

        .video-player-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        .video-player-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            object-fit: contain;
            background: #000;
        }

        .video-body {
            padding: 45px;
            text-align: center;
        }

        .btn-finish {
            width: 100%;
            padding: 25px;
            border-radius: 25px;
            border: none;
            background: #e0e0e0;
            color: #888;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s ease;
            margin-top: 30px;
        }

        .btn-finish:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .btn-active {
            background: linear-gradient(135deg, var(--fucsia) 0%, var(--fucsia-dark) 100%);
            color: white;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* CONTROLES DEL REPRODUCTOR - MEJORADOS */
        .video-player-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease;
            opacity: 1;
        }

        .video-player-controls .btn-group {
            display: flex;
            align-items: center;
            gap: 20px;
            pointer-events: auto;
        }

        .video-player-controls.hidden {
            opacity: 0;
        }

        .btn-custom-ctrl {
            background: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3) !important;
            color: white !important;
            width: 65px !important;
            height: 65px !important;
            font-size: 22px !important;
            border-radius: 50% !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5) !important;
            padding: 0 !important;
            pointer-events: auto;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-custom-ctrl:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3) !important;
        }

        .btn-custom-ctrl:active {
            transform: scale(0.95);
        }

        .btn-play-pause {
            width: 85px !important;
            height: 85px !important;
            font-size: 38px !important;
            background: rgba(216, 27, 96, 0.85) !important;
            border-color: rgba(216, 27, 96, 0.8) !important;
        }

        .btn-play-pause:hover {
            background: rgba(216, 27, 96, 1) !important;
            transform: scale(1.1);
        }

        .btn-rewind {
            width: 65px !important;
            height: 65px !important;
            font-size: 18px !important;
            font-weight: 600 !important;
            background: rgba(255, 255, 255, 0.15) !important;
        }

        .btn-rewind:hover {
            background: rgba(255, 255, 255, 0.3) !important;
        }

        .btn-rewind i {
            font-size: 20px;
        }

        .btn-rewind .rewind-text {
            font-size: 11px;
            font-weight: 700;
            margin-left: 2px;
        }

        .video-bottom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 11;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .video-player-box:hover .video-bottom-controls,
        .video-player-box:active .video-bottom-controls {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-bottom-ctrl {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s ease;
            backdrop-filter: blur(4px);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-bottom-ctrl:hover {
            background: var(--fucsia);
            transform: scale(1.1);
        }

        .btn-bottom-ctrl:active {
            transform: scale(0.95);
        }

        .video-time-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-family: monospace;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            z-index: 11;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .video-player-box:hover .video-time-display,
        .video-player-box:active .video-time-display {
            opacity: 1;
        }

        .custom-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            z-index: 11;
            pointer-events: none;
        }

        .custom-progress-fill {
            height: 100%;
            background: var(--fucsia);
            width: 0%;
            transition: width 0.1s linear;
        }

        .video-locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            backdrop-filter: blur(6px);
        }

        .video-locked-overlay p {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            padding: 0 20px;
            color: var(--fucsia-light);
        }

        .video-player-box:fullscreen {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            background: black;
        }

        .video-player-box:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            background: black;
        }

        .badge-video-count {
            background: var(--fucsia-light);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--fucsia);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Para móviles - controles siempre visibles al tocar */
        @media (max-width: 768px) {
            .video-player-controls {
                opacity: 1 !important;
            }
            .video-player-controls.hidden {
                opacity: 1 !important;
            }
            .video-bottom-controls {
                opacity: 1 !important;
                pointer-events: auto !important;
            }
            .video-time-display {
                opacity: 1 !important;
            }
            .btn-custom-ctrl {
                width: 50px !important;
                height: 50px !important;
                font-size: 16px !important;
            }
            .btn-play-pause {
                width: 70px !important;
                height: 70px !important;
                font-size: 30px !important;
            }
            .btn-rewind {
                width: 50px !important;
                height: 50px !important;
                font-size: 14px !important;
            }
            .btn-rewind i {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="header-bar">
        <div class="container">
            <div class="nav-top">
                <a href="bienvenido.html" class="back-link">← Ver todas las sesiones</a>
                <img src="logo.png" alt="Logo" class="logo-img">
            </div>
            <div class="session-info">
                <h1 id="txtSesion">Cargando sesión...</h1>
                <p style="opacity: 0.95; font-size: 19px;">Tu camino hacia una maternidad informada ✨</p>
            </div>
        </div>
    </div>

    <div class="container main-content">
        <div id="videoContainer">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p style="margin-top: 20px; color: #666;">Cargando videos...</p>
            </div>
        </div>

        <div class="footer-cta">
            <button id="btnFinish" class="btn-finish" disabled>
                🔒 Termina de ver los videos para avanzar
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQXNj667woEMLUphhlHCAFeoAhEY0IuNM",
            authDomain: "educa-prenatal.firebaseapp.com",
            projectId: "educa-prenatal",
            storageBucket: "educa-prenatal.firebasestorage.app",
            messagingSenderId: "474992751698",
            appId: "1:474992751698:web:f313f8def5ff266a45b8b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const params = new URLSearchParams(window.location.search);
        const sesionId = parseInt(params.get('id')) || 1;

        const nombresSesiones = [
            "Conociendo mi Embarazo",
            "Cambios Físicos y Apariencia",
            "Salud del Bebé y CPN",
            "Preparación para el Parto",
            "Manejo del Dolor y Relajación",
            "Puerperio y Recuperación",
            "Lactancia y Cuidado del Bebé",
            "Preparación Emocional Maternidad"
        ];

        const nombreActual = nombresSesiones[sesionId - 1] || "Módulo Educativo";
        document.getElementById("txtSesion").innerText = `SESIÓN ${sesionId}: ${nombreActual}`;

        const videoContainer = document.getElementById("videoContainer");
        const btnFinish = document.getElementById("btnFinish");

        let currentUserDocId = null;
        let currentUserData = null;
        let nivelDesbloqueado = 1;
        let videosCompletadosNube = 0;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const q = query(collection(db, "users"), where("uid", "==", user.uid));
                    const snap = await getDocs(q);
                    
                    if (!snap.empty) {
                        currentUserDocId = snap.docs[0].id;
                        currentUserData = snap.docs[0].data();
                        nivelDesbloqueado = currentUserData.nivelDesbloqueado || 1;

                        if (currentUserData.progress && currentUserData.progress[sesionId]) {
                            videosCompletadosNube = currentUserData.progress[sesionId];
                        }

                        if (sesionId > nivelDesbloqueado) {
                            window.location.href = "bienvenido.html";
                            return;
                        }
                        
                        await loadData();
                    }
                } catch (error) {
                    console.error("Error en autenticación:", error);
                    mostrarError("Error al autenticar usuario.");
                }
            } else {
                window.location.href = "index.html";
            }
        });

        async function loadData() {
            try {
                const q = query(
                    collection(db, "videos"),
                    where("sesion", "==", sesionId)
                );
                
                const snap = await getDocs(q);

                if (snap.empty) {
                    mostrarMensajeSinVideos();
                    return;
                }

                const videosArray = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    videosArray.push({
                        id: doc.id,
                        titulo: data.titulo || 'Lección de video',
                        videoUrl: data.videoUrl,
                        cloudName: data.cloudName || 'N/A'
                    });
                });

                videosArray.sort((a, b) => (a.titulo || '').localeCompare(b.titulo || ''));
                renderVideos(videosArray);

            } catch (error) {
                console.error("Error en loadData:", error);
                mostrarError("Error al cargar los videos: " + error.message);
            }
        }

        function mostrarMensajeSinVideos() {
            videoContainer.innerHTML = `
                <div class="video-wrapper" style="padding:60px; text-align:center;">
                    <h3 style="color:var(--fucsia)">📹 Contenido en preparación</h3>
                    <p>Aún no hay videos disponibles para la sesión ${sesionId}.</p>
                    <a href="bienvenido.html" style="display:inline-block; margin-top:20px; background: var(--fucsia); color:white; border:none; padding:12px 30px; border-radius:12px; font-weight:600; text-decoration:none;">
                        ← Volver al dashboard
                    </a>
                </div>`;
            btnFinish.disabled = true;
            btnFinish.classList.remove("btn-active");
            btnFinish.innerHTML = "🔒 Esperando material de estudio";
        }

        function mostrarError(mensaje) {
            videoContainer.innerHTML = `
                <div class="video-wrapper" style="padding:60px; text-align:center;">
                    <h3 style="color:var(--fucsia)">⚠️ Error</h3>
                    <p>${mensaje}</p>
                    <button onclick="location.reload()" style="margin-top:20px; background: var(--fucsia); color:white; border:none; padding:12px 30px; border-radius:12px; font-weight:600; cursor:pointer;">
                        🔄 Reintentar
                    </button>
                </div>`;
            btnFinish.disabled = true;
        }

        function renderVideos(videosArray) {
            videoContainer.innerHTML = "";
            
            videoContainer.innerHTML = `
                <div style="text-align: center; margin-bottom: 20px;">
                    <span class="badge-video-count">
                        <i class="fas fa-video me-1"></i> ${videosArray.length} video${videosArray.length > 1 ? 's' : ''} disponible${videosArray.length > 1 ? 's' : ''}
                    </span>
                </div>
            `;

            videosArray.forEach((data, index) => {
                const videoUrl = data.videoUrl || '';
                
                videoContainer.innerHTML += `
                <div class="video-wrapper">
                    <h3 style="color: var(--fucsia); margin-bottom: 15px; font-weight: 600; font-size: 1.3rem; padding-left: 10px; border-left: 4px solid var(--fucsia);">
                        ${data.titulo || 'Lección de video'}
                    </h3>

                    <div class="video-player-box" id="player-box-${index}">
                        <video id="video-${index}" playsinline webkit-playsinline preload="metadata"
                            style="width: 100%; height: 100%; cursor: pointer; object-fit: contain; background: #000;">
                            <source src="${videoUrl}" type="video/mp4">
                            Tu navegador no soporta videos HTML5.
                        </video>
                        
                        <!-- CONTROLES CENTRALES -->
                        <div id="controls-group-${index}" class="video-player-controls">
                            <div class="btn-group">
                                <button id="btn-back-${index}" class="btn-custom-ctrl btn-rewind" aria-label="Retroceder 10 segundos">
                                    <i class="fas fa-undo"></i>
                                    <span class="rewind-text">10</span>
                                </button>
                                <button id="btn-play-${index}" class="btn-custom-ctrl btn-play-pause" aria-label="Reproducir/Pausar">
                                    <i class="fas fa-play"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- TIEMPO -->
                        <div id="time-display-${index}" class="video-time-display">0:00 / 0:00</div>
                        
                        <!-- CONTROLES INFERIORES -->
                        <div class="video-bottom-controls">
                            <button id="btn-mute-${index}" class="btn-bottom-ctrl" title="Silenciar/Sonido">🔊</button>
                            <button id="btn-full-${index}" class="btn-bottom-ctrl" title="Pantalla Completa">⛶</button>
                        </div>
                        
                        <!-- BARRA DE PROGRESO -->
                        <div class="custom-progress-bar">
                            <div id="progress-fill-${index}" class="custom-progress-fill"></div>
                        </div>
                        
                        <!-- BLOQUEO -->
                        <div class="video-locked-overlay" id="locked-overlay-${index}" style="display: none;">
                            <div style="font-size: 50px; margin-bottom: 10px;">🔒</div>
                            <p>Termina de ver el video anterior para desbloquear</p>
                        </div>
                    </div>
                    <div class="video-body">
                        <p>Disfruta de este video educativo para la SESIÓN ${sesionId}.</p>
                    </div>
                </div>`;
            });

            setTimeout(() => {
                setupVideoPlayers();
            }, 200);
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${min}:${sec}`;
        }

        function setupVideoPlayers() {
            const videos = document.querySelectorAll('.video-player-box video');
            const totalVideos = videos.length;

            if (totalVideos === 0) return;

            if (videosCompletadosNube >= totalVideos || sesionId < nivelDesbloqueado) {
                btnFinish.disabled = false;
                btnFinish.classList.add("btn-active");
                btnFinish.innerHTML = "✨ ¡Completar Sesión!";
                videosCompletadosNube = totalVideos;
            }

            videos.forEach((video, index) => {
                const playerBox = document.getElementById(`player-box-${index}`);
                const playBtn = document.getElementById(`btn-play-${index}`);
                const backBtn = document.getElementById(`btn-back-${index}`);
                const controlsGroup = document.getElementById(`controls-group-${index}`);
                const muteBtn = document.getElementById(`btn-mute-${index}`);
                const fullBtn = document.getElementById(`btn-full-${index}`);
                const progressFill = document.getElementById(`progress-fill-${index}`);
                const timeDisplay = document.getElementById(`time-display-${index}`);
                const lockOverlay = document.getElementById(`locked-overlay-${index}`);
                const bottomControls = playerBox?.querySelector('.video-bottom-controls');

                if (index > videosCompletadosNube && lockOverlay) {
                    lockOverlay.style.display = "flex";
                    return;
                } else if (lockOverlay) {
                    lockOverlay.style.display = "none";
                }

                let controlsTimeout;

                const showControls = () => {
                    if (controlsGroup) {
                        controlsGroup.classList.remove('hidden');
                    }
                    if (timeDisplay) timeDisplay.style.opacity = "1";
                    if (bottomControls) bottomControls.style.opacity = "1";

                    clearTimeout(controlsTimeout);

                    if (!video.paused) {
                        controlsTimeout = setTimeout(() => {
                            if (controlsGroup) controlsGroup.classList.add('hidden');
                            if (timeDisplay) timeDisplay.style.opacity = "0";
                            if (bottomControls) bottomControls.style.opacity = "0";
                        }, 3000);
                    }
                };

                const togglePlay = () => {
                    if (video.paused) {
                        video.play().then(() => {
                            if (playBtn) {
                                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                                playBtn.classList.add('is-pausing');
                            }
                            showControls();
                        }).catch(err => {
                            console.error("Error al reproducir:", err);
                            if (err.name === 'NotAllowedError') {
                                Swal.fire('Atención', 'Haz clic en el video para activar la reproducción.', 'info');
                            }
                        });
                    } else {
                        video.pause();
                        if (playBtn) {
                            playBtn.innerHTML = '<i class="fas fa-play"></i>';
                            playBtn.classList.remove('is-pausing');
                        }
                        showControls();
                    }
                };

                // Función para retroceder 10 segundos
                const rewindVideo = () => {
                    const newTime = Math.max(0, video.currentTime - 10);
                    video.currentTime = newTime;
                    
                    // Actualizar la barra de progreso inmediatamente
                    if (video.duration && progressFill) {
                        const percentage = (video.currentTime / video.duration) * 100;
                        progressFill.style.width = `${percentage}%`;
                    }
                    if (timeDisplay) {
                        timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
                    }
                    
                    showControls();
                    
                    // Efecto visual de retroceso
                    if (backBtn) {
                        backBtn.style.transform = 'scale(0.8)';
                        setTimeout(() => {
                            backBtn.style.transform = 'scale(1)';
                        }, 200);
                    }
                };

                // EVENTOS DEL VIDEO
                video.addEventListener('loadedmetadata', () => {
                    if (timeDisplay) {
                        timeDisplay.innerText = `0:00 / ${formatTime(video.duration)}`;
                    }
                });

                video.addEventListener('timeupdate', () => {
                    if (video.duration) {
                        const percentage = (video.currentTime / video.duration) * 100;
                        if (progressFill) {
                            progressFill.style.width = `${percentage}%`;
                        }
                        if (timeDisplay) {
                            timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
                        }
                    }
                });

                video.addEventListener('play', () => {
                    if (playBtn) {
                        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        playBtn.classList.add('is-pausing');
                    }
                    if (controlsGroup) {
                        controlsGroup.classList.remove('hidden');
                        clearTimeout(controlsTimeout);
                        controlsTimeout = setTimeout(() => {
                            controlsGroup.classList.add('hidden');
                        }, 3000);
                    }
                });

                video.addEventListener('pause', () => {
                    if (playBtn) {
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        playBtn.classList.remove('is-pausing');
                    }
                    if (controlsGroup) {
                        controlsGroup.classList.remove('hidden');
                        clearTimeout(controlsTimeout);
                    }
                });

                video.addEventListener('ended', async () => {
                    if (playBtn) {
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        playBtn.classList.remove('is-pausing');
                    }
                    showControls();

                    if (index === videosCompletadosNube) {
                        videosCompletadosNube++;
                        const nextOverlay = document.getElementById(`locked-overlay-${videosCompletadosNube}`);
                        if (nextOverlay) nextOverlay.style.display = "none";

                        let userProgress = currentUserData.progress || {};
                        userProgress[sesionId] = videosCompletadosNube;
                        await updateDoc(doc(db, "users", currentUserDocId), { progress: userProgress });
                    }

                    if (videosCompletadosNube >= totalVideos) {
                        btnFinish.disabled = false;
                        btnFinish.classList.add("btn-active");
                        btnFinish.innerHTML = "¡Completar Sesión! ✨";
                    }
                });

                // EVENTOS DE TECLADO
                video.addEventListener('keydown', (e) => {
                    if (e.key === ' ' || e.key === 'Space') {
                        e.preventDefault();
                        togglePlay();
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        rewindVideo();
                    }
                });

                // EVENTOS DE LOS BOTONES
                video.addEventListener('click', (e) => {
                    e.stopPropagation();
                    togglePlay();
                });

                if (playBtn) {
                    playBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        togglePlay();
                    });
                    
                    // Soporte para touch devices
                    playBtn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        togglePlay();
                    }, { passive: false });
                }

                // Botón Retroceder - CORREGIDO
                if (backBtn) {
                    backBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        rewindVideo();
                    });
                    
                    // Soporte para touch devices
                    backBtn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        rewindVideo();
                    }, { passive: false });
                }

                if (muteBtn) {
                    muteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        video.muted = !video.muted;
                        muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
                        showControls();
                    });
                }

                if (fullBtn) {
                    fullBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                            if (playerBox.requestFullscreen) {
                                playerBox.requestFullscreen();
                            } else if (playerBox.webkitRequestFullscreen) {
                                playerBox.webkitRequestFullscreen();
                            } else if (video.webkitEnterFullscreen) {
                                video.webkitEnterFullscreen();
                            }
                        } else {
                            if (document.exitFullscreen) {
                                document.exitFullscreen();
                            } else if (document.webkitExitFullscreen) {
                                document.webkitExitFullscreen();
                            }
                        }
                    });
                }

                if (playerBox) {
                    playerBox.addEventListener('mousemove', showControls);
                    playerBox.addEventListener('touchstart', showControls);
                }

                setTimeout(showControls, 500);
            });
        }

        btnFinish.addEventListener('click', async () => {
            btnFinish.disabled = true;
            btnFinish.innerHTML = "⏳ Guardando progreso...";

            try {
                let siguienteSesion = sesionId + 1;

                if (siguienteSesion > nivelDesbloqueado) {
                    await updateDoc(doc(db, "users", currentUserDocId), {
                        nivelDesbloqueado: siguienteSesion
                    });
                }

                if (sesionId === 8) {
                    Swal.fire({
                        title: '¡FELICITACIONES!',
                        text: 'Has completado satisfactoriamente todo el curso. Ya puedes visualizar y descargar tu certificado oficial.',
                        icon: 'success',
                        confirmButtonText: 'Ver mi Diploma 🎓',
                        confirmButtonColor: '#ff4d7d',
                        allowOutsideClick: false
                    }).then(() => {
                        window.location.href = "bienvenido.html?showDiploma=true";
                    });
                } else {
                    window.location.href = "bienvenido.html?refresh=" + new Date().getTime();
                }

            } catch (error) {
                console.error("Error al finalizar la sesión:", error);
                btnFinish.disabled = false;
                btnFinish.innerHTML = "✨ ¡Completar Sesión!";
                Swal.fire('Error', 'No se pudo guardar el progreso. Intenta nuevamente.', 'error');
            }
        });
    </script>
</body>

</html>
