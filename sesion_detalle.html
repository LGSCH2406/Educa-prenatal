<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Detalle | Educa-prenatal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
        :root { 
            --fucsia: #d81b60; 
            --fucsia-dark: #ad1457;
            --fucsia-light: #f06292;
            --white: #ffffff;
            --bg-soft: #fff5f8;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg-soft); 
            margin: 0; 
            padding: 0; 
            color: #444; 
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(216, 27, 96, 0.08) 0%, transparent 35%),
                radial-gradient(circle at 100% 100%, rgba(216, 27, 96, 0.05) 0%, transparent 35%);
        }

        .header-bar {
            background: linear-gradient(135deg, var(--fucsia) 0%, var(--fucsia-dark) 100%);
            padding: 60px 20px 100px;
            color: white;
            border-radius: 0 0 60px 60px;
            box-shadow: 0 15px 40px rgba(173, 20, 87, 0.3);
            position: relative;
            z-index: 1;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        .nav-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin-bottom: 10px; 
        }

        .logo-img { 
            height: 180px; 
            width: auto;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3)); 
            transition: transform 0.3s ease;
            margin-top: -20px;
        }
        
        .back-link { 
            color: white; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 15px;
            background: rgba(255,255,255,0.2); 
            padding: 12px 24px; 
            border-radius: 15px;
            backdrop-filter: blur(8px); 
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .session-info { margin-top: -30px; }
        .session-info h1 { 
            font-size: 48px; 
            margin: 0; 
            font-weight: 600; 
            letter-spacing: -1.5px;
        }

        .main-content { transform: translateY(-60px); z-index: 10; position: relative; }

        .video-wrapper { 
            background: var(--white); 
            border-radius: 40px; 
            overflow: hidden; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.12); 
            border: 2px solid var(--white);
            margin-bottom: 30px;
        }

        /* --- REPRODUCTOR 100% INVISIBLE --- */
        .video-player-box { 
            position: relative; 
            padding-bottom: 56.25%; /* Mantiene la proporción 16:9 */
            height: 0; 
            overflow: hidden; 
            background: #000; 
            border-bottom: 8px solid var(--fucsia-light); 
        }

        .video-player-box video { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            cursor: pointer; 
        }

        .video-body { padding: 45px; text-align: center; }
        .video-body h3 { font-size: 32px; color: var(--fucsia-dark); margin-bottom: 15px; }
        
        .btn-finish { 
            width: 100%; padding: 25px; border-radius: 25px; border: none;
            background: #e0e0e0; color: #888; font-size: 20px; font-weight: 600;
            cursor: pointer; transition: 0.4s ease; margin-top: 30px;
        }

        .btn-active { 
            background: linear-gradient(135deg, var(--fucsia) 0%, var(--fucsia-dark) 100%); 
            color: white; 
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* --- ESTILOS DE CONTROLES PERSONALIZADOS GRUPALES --- */
        .video-player-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 25px; /* Espacio elegante entre botones */
            z-index: 10;
            transition: opacity 0.3s ease;
            opacity: 1; 
        }

        .video-player-controls.playing {
            opacity: 0;
            pointer-events: none; 
        }

        .video-player-box:hover .video-player-controls.playing {
            opacity: 1;
            pointer-events: auto; 
        }

        .btn-custom-ctrl {
            background: rgba(216, 27, 96, 0.95); 
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            padding: 0;
        }

        .btn-custom-ctrl:hover {
            transform: scale(1.1);
            background: var(--fucsia-dark);
        }

        .btn-play-pause {
            width: 80px;
            height: 80px;
            font-size: 35px;
            padding-left: 8px; /* Ajuste visual para el triángulo ▶️ */
        }

        .btn-play-pause.is-pausing {
            padding-left: 0 !important; /* Centra el ícono de Pausa ⏸️ */
        }

        .btn-rewind {
            width: 65px;
            height: 65px;
            font-size: 16px; /* Letra un poco más pequeña para que quepa bien el texto */
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="container">
        <div class="nav-top">
            <a href="bienvenido.html" class="back-link">← Ver todas las sesiones</a>
            <img src="logo.png" alt="Logo" class="logo-img">
        </div>
        <div class="session-info">
            <h1 id="txtSesion">Cargando sesión...</h1>
            <p style="opacity: 0.95; font-size: 19px;">Tu camino hacia una maternidad informada ✨</p>
        </div>
    </div>
</div>

<div class="container main-content">
    <div id="videoContainer">
        </div>

    <div class="footer-cta">
        <button id="btnFinish" class="btn-finish btn-active">
            ✨ ¡Completar Sesión!
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 1. Tu configuración de Firebase se mantiene intacta
    const firebaseConfig = {
        apiKey: "AIzaSyCQXNj667woEMLUphhlHCAFEoAhEY0IuNM",
        authDomain: "educa-prenatal.firebaseapp.com",
        projectId: "educa-prenatal",
        storageBucket: "educa-prenatal.firebasestorage.app",
        messagingSenderId: "474992751698",
        appId: "1:474992751698:web:f313f8def5ff266a45b8b8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const sesionId = parseInt(params.get('id')) || 1;

    document.getElementById("txtSesion").innerText = Sesión ${sesionId};
    const videoContainer = document.getElementById("videoContainer");
    const btnFinish = document.getElementById("btnFinish");

    async function loadData() {
        // Buscamos los videos en Firestore
        const q = query(collection(db, "videos"), where("sesion", "==", sesionId));
        const snap = await getDocs(q);

        if (snap.empty) {
            videoContainer.innerHTML = `<div class="video-wrapper" style="padding:60px; text-align:center;">
                <h3 style="color:var(--fucsia)">Próximamente</h3>
                <p>Aún no hay videos disponibles para la sesión ${sesionId}.</p>
            </div>`;
            return;
        }

        videoContainer.innerHTML = "";
        let index = 0; // Usamos un contador para darle un ID único a cada video

        snap.forEach(doc => {
            const data = doc.data();
            
            // Leemos el campo "data.videoUrl" en lugar de "data.videoDriveId"
            videoContainer.innerHTML += `
                <div class="video-wrapper">
                    <div class="video-player-box">
                        <video id="video-${index}" src="${data.videoUrl}" style="width: 100%; height: 100%; cursor: pointer; object-fit: cover;"></video>
                        
                        <div id="controls-group-${index}" class="video-player-controls">
                            
                            <button id="btn-back-${index}" class="btn-custom-ctrl btn-rewind" title="Retroceder 10 segundos">↺ 10s</button>
                            
                            <button id="btn-play-${index}" class="btn-custom-ctrl btn-play-pause">▶️</button>
                        
                        </div>
                    </div>
                    <div class="video-body">
                        <h3>${data.titulo}</h3>
                        <p>Disfruta de este video educativo para el Módulo ${sesionId}.</p>
                    </div>
                </div>
            `;
            index++;
        });

        // 3. Una vez que los videos están en la página, activamos los clics
        activarReproductorInvisible();
    }

    // 4. NUEVA FUNCIÓN: Lógica para Reproducir/Pausar al hacer clic
    function activarReproductorInvisible() {
        const videos = document.querySelectorAll('video');

        videos.forEach((video, index) => {
            const playBtn = document.getElementById(btn-play-${index});
            const backBtn = document.getElementById(btn-back-${index});
            const controlsGroup = document.getElementById(controls-group-${index});

            // Función para alternar Play/Pausa y cambiar íconos/estilos
            const togglePlay = () => {
                if (video.paused) {
                    video.play().then(() => {
                        playBtn.innerHTML = "⏸️"; // Ícono de pausa
                        playBtn.classList.add('is-pausing'); // Quitar padding extra
                        controlsGroup.classList.add('playing'); // Ocultar grupo entero
                    }).catch(e => console.error("Error al reproducir:", e));
                } else {
                    video.pause();
                    playBtn.innerHTML = "▶️"; // Ícono de play
                    playBtn.classList.remove('is-pausing'); // Volver a poner padding extra
                    controlsGroup.classList.remove('playing'); // Mostrar grupo entero
                }
            };

            // Lógica del botón de retroceso (↺)
            const rewind10Seconds = (e) => {
                // Detenemos la propagación para que el clic NO active togglePlay del video contenedor
                e.stopPropagation(); 
                
                // Restamos 10 segundos al tiempo actual.
                // Math.max(0, ...) asegura que nunca bajemos de 0 (el inicio).
                video.currentTime = Math.max(0, video.currentTime - 10);
            };

            // --- ASIGNAR EVENTOS DE CLIC ---
            
            // Clic en el video físico: Reproduce/Pausa
            video.addEventListener('click', togglePlay);
            
            // Clic en el botón Play/Pausa
            playBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Evitar clic doble con el video debajo
                togglePlay();
            });

            // Clic en el nuevo botón de Retroceder (↺)
            backBtn.addEventListener('click', rewind10Seconds);

            // Sincronizar UI si el video termina (vuelve a aparecer el grupo con ícono Play)
            video.addEventListener('ended', () => {
                playBtn.innerHTML = "▶️";
                playBtn.classList.remove('is-pausing');
                controlsGroup.classList.remove('playing');
            });
        });
    }

    // 5. El botón de finalizar sesión se mantiene igual
    btnFinish.onclick = () => {
        let progress = parseInt(localStorage.getItem('prenatal_progress')) || 0;
        if (sesionId > progress) {
            localStorage.setItem('prenatal_progress', sesionId);
        }
        window.location.href = "bienvenido.html";
    };

    loadData();
</script>
</body>
</html>
