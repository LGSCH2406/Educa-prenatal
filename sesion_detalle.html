<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Detalle | Educa-prenatal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --fucsia: #d81b60; 
            --fucsia-dark: #ad1457;
            --fucsia-light: #f06292;
            --white: #ffffff;
            --bg-soft: #fff5f8;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg-soft); 
            margin: 0; 
            padding: 0; 
            color: #444; 
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(216, 27, 96, 0.08) 0%, transparent 35%),
                radial-gradient(circle at 100% 100%, rgba(216, 27, 96, 0.05) 0%, transparent 35%);
        }

        .header-bar {
            background: linear-gradient(135deg, var(--fucsia) 0%, var(--fucsia-dark) 100%);
            padding: 60px 20px 100px;
            color: white;
            border-radius: 0 0 60px 60px;
            box-shadow: 0 15px 40px rgba(173, 20, 87, 0.3);
            position: relative;
            z-index: 1;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        .nav-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin-bottom: 10px; 
        }

        .logo-img { 
            height: 180px; 
            width: auto;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3)); 
            transition: transform 0.3s ease;
            margin-top: -20px;
        }
        
        .back-link { 
            color: white; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 15px;
            background: rgba(255,255,255,0.2); 
            padding: 12px 24px; 
            border-radius: 15px;
            backdrop-filter: blur(8px); 
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .session-info { margin-top: -30px; }
        .session-info h1 { font-size: 48px; margin: 0; font-weight: 600; letter-spacing: -1.5px; }

        .main-content { transform: translateY(-60px); z-index: 10; position: relative; }

        .video-wrapper { 
            background: var(--white); 
            border-radius: 40px; 
            overflow: hidden; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.12); 
            border: 2px solid var(--white);
            margin-bottom: 30px;
        }

        /* --- REPRODUCTOR --- */
        .video-player-box { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            background: #000; 
        }

        .video-player-box video { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; 
        }

        .video-body { padding: 45px; text-align: center; }
        .video-body h3 { font-size: 32px; color: var(--fucsia-dark); margin-bottom: 15px; }
        
        /* --- ESTILOS DEL BOTÓN DE COMPLETAR --- */
        .btn-finish { 
            width: 100%; padding: 25px; border-radius: 25px; border: none;
            background: #e0e0e0; color: #888; font-size: 20px; font-weight: 600;
            cursor: pointer; transition: 0.4s ease; margin-top: 30px;
        }
        
        .btn-finish:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .btn-active { 
            background: linear-gradient(135deg, var(--fucsia) 0%, var(--fucsia-dark) 100%); 
            color: white; box-shadow: 0 15px 35px rgba(216, 27, 96, 0.4); animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* --- CONTROLES CENTRALES --- */
        .video-player-controls {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center; gap: 25px; z-index: 10; transition: opacity 0.3s ease; opacity: 1; 
        }
        .video-player-controls.playing { opacity: 0; pointer-events: none; }
        .video-player-box:hover .video-player-controls.playing { opacity: 1; pointer-events: auto; }

        .btn-custom-ctrl {
            background: rgba(216, 27, 96, 0.95); color: white; border: none; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.4); padding: 0;
        }
        .btn-custom-ctrl:hover { transform: scale(1.1); background: var(--fucsia-dark); }
        .btn-play-pause { width: 80px; height: 80px; font-size: 35px; padding-left: 8px; }
        .btn-play-pause.is-pausing { padding-left: 0 !important; }
        .btn-rewind { width: 65px; height: 65px; font-size: 16px; font-weight: 600; }

        /* --- CONTROLES INFERIORES --- */
        .video-bottom-controls {
            position: absolute; bottom: 20px; right: 20px; display: flex; gap: 12px; z-index: 10;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .video-player-box:hover .video-bottom-controls { opacity: 1; }
        .btn-bottom-ctrl {
            background: rgba(0, 0, 0, 0.5); color: white; border: none; border-radius: 50%; width: 45px; height: 45px;
            font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: 0.3s ease; backdrop-filter: blur(4px);
        }
        .btn-bottom-ctrl:hover { background: var(--fucsia); transform: scale(1.1); }

        .video-time-display {
            position: absolute; bottom: 20px; left: 20px; background: rgba(0, 0, 0, 0.5); color: white;
            font-family: monospace; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 12px;
            backdrop-filter: blur(4px); z-index: 10; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .video-player-box:hover .video-time-display { opacity: 1; }

        .custom-progress-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: rgba(255, 255, 255, 0.3); z-index: 10; pointer-events: none; }
        .custom-progress-fill { height: 100%; background: var(--fucsia); width: 0%; transition: width 0.1s linear; }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="container">
        <div class="nav-top">
            <a href="bienvenido.html" class="back-link">← Ver todas las sesiones</a>
            <img src="logo.png" alt="Logo" class="logo-img">
        </div>
        <div class="session-info">
            <h1 id="txtSesion">Cargando sesión...</h1>
            <p style="opacity: 0.95; font-size: 19px;">Tu camino hacia una maternidad informada ✨</p>
        </div>
    </div>
</div>

<div class="container main-content">
    <div id="videoContainer"></div>

    <div class="footer-cta">
        <button id="btnFinish" class="btn-finish" disabled>
            🔒 Termina de ver el video para avanzar
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    // 🌟 IMPORTANTE: Añadí Auth, doc y updateDoc para poder guardar el progreso de los videos en la base de datos
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCQXNj667woEMLUphhlHCAFEoAhEY0IuNM",
        authDomain: "educa-prenatal.firebaseapp.com",
        projectId: "educa-prenatal",
        storageBucket: "educa-prenatal.firebasestorage.app",
        messagingSenderId: "474992751698",
        appId: "1:474992751698:web:f313f8def5ff266a45b8b8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); 

    const params = new URLSearchParams(window.location.search);
    const sesionId = parseInt(params.get('id')) || 1;

    document.getElementById("txtSesion").innerText = `Sesión ${sesionId}`;
    const videoContainer = document.getElementById("videoContainer");
    const btnFinish = document.getElementById("btnFinish");

    // 🌟 NUEVO: Variables para identificar quién está viendo el video
    let currentUserDocId = null;
    let currentUserData = null;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const q = query(collection(db, "users"), where("uid", "==", user.uid));
            const snap = await getDocs(q);
            if (!snap.empty) {
                currentUserDocId = snap.docs[0].id;
                currentUserData = snap.docs[0].data();
            }
        }
    });

    let progress = parseInt(localStorage.getItem('prenatal_progress')) || 0;
    if (sesionId <= progress) {
        btnFinish.disabled = false;
        btnFinish.classList.add("btn-active");
        btnFinish.innerHTML = "✨ ¡Completar Sesión!";
    }

    async function loadData() {
        const q = query(collection(db, "videos"), where("sesion", "==", sesionId));
        const snap = await getDocs(q);

        if (snap.empty) {
            videoContainer.innerHTML = `<div class="video-wrapper" style="padding:60px; text-align:center;">
                <h3 style="color:var(--fucsia)">Próximamente</h3>
                <p>Aún no hay videos disponibles para la sesión ${sesionId}.</p>
            </div>`;
            return;
        }

        videoContainer.innerHTML = "";
        let index = 0; 

        snap.forEach(doc => {
            const data = doc.data();
            
            videoContainer.innerHTML += `
                <div class="video-wrapper">
                    <div class="video-player-box" id="player-box-${index}">
                        <video id="video-${index}" src="${data.videoUrl}" style="width: 100%; height: 100%; cursor: pointer; object-fit: cover;"></video>
                        
                        <div id="controls-group-${index}" class="video-player-controls">
                            <button id="btn-back-${index}" class="btn-custom-ctrl btn-rewind" title="Retroceder 10 segundos">↺ 10s</button>
                            <button id="btn-play-${index}" class="btn-custom-ctrl btn-play-pause">▶</button>
                        </div>

                        <div id="time-display-${index}" class="video-time-display">0:00 / 0:00</div>

                        <div class="video-bottom-controls">
                            <button id="btn-mute-${index}" class="btn-bottom-ctrl" title="Silenciar/Sonido">🔊</button>
                            <button id="btn-full-${index}" class="btn-bottom-ctrl" title="Pantalla Completa">⛶</button>
                        </div>

                        <div class="custom-progress-bar">
                            <div id="progress-fill-${index}" class="custom-progress-fill"></div>
                        </div>
                    </div>
                    <div class="video-body">
                        <h3>${data.titulo}</h3>
                        <p>Disfruta de este video educativo para el Módulo ${sesionId}.</p>
                    </div>
                </div>
            `;
            index++;
        });

        activarReproductorInvisible();
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${min}:${sec}`;
    }

    function activarReproductorInvisible() {
        const videos = document.querySelectorAll('video');
        
        // 🌟 Usamos esto para contar cuántos videos distintos ha completado hoy
        const videosVistos = new Set(); 

        videos.forEach((video, index) => {
            const playerBox = document.getElementById(`player-box-${index}`);
            const playBtn = document.getElementById(`btn-play-${index}`);
            const backBtn = document.getElementById(`btn-back-${index}`);
            const controlsGroup = document.getElementById(`controls-group-${index}`);
            const muteBtn = document.getElementById(`btn-mute-${index}`);
            const fullBtn = document.getElementById(`btn-full-${index}`);
            const progressFill = document.getElementById(`progress-fill-${index}`);
            const timeDisplay = document.getElementById(`time-display-${index}`);

            const togglePlay = () => {
                if (video.paused) {
                    video.play().then(() => {
                        playBtn.innerHTML = "⏸"; 
                        playBtn.classList.add('is-pausing'); 
                        controlsGroup.classList.add('playing'); 
                    }).catch(e => console.error("Error al reproducir:", e));
                } else {
                    video.pause();
                    playBtn.innerHTML = "▶"; 
                    playBtn.classList.remove('is-pausing'); 
                    controlsGroup.classList.remove('playing'); 
                }
            };

            const rewind10Seconds = (e) => {
                e.stopPropagation(); 
                video.currentTime = Math.max(0, video.currentTime - 10);
            };

            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                video.muted = !video.muted; 
                muteBtn.innerHTML = video.muted ? "🔇" : "🔊"; 
            });

            fullBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                if (!document.fullscreenElement) {
                    if (playerBox.requestFullscreen) playerBox.requestFullscreen();
                    else if (playerBox.webkitRequestFullscreen) playerBox.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            });

            video.addEventListener('loadedmetadata', () => {
                timeDisplay.innerText = `0:00 / ${formatTime(video.duration)}`;
            });

            video.addEventListener('timeupdate', () => {
                if (video.duration) {
                    const percentage = (video.currentTime / video.duration) * 100;
                    progressFill.style.width = `${percentage}%`;
                    timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
                }
            });

            video.addEventListener('click', togglePlay);
            playBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
            backBtn.addEventListener('click', rewind10Seconds);

            // --- 🌟 CUANDO EL VIDEO TERMINA DE REPRODUCIRSE ---
            video.addEventListener('ended', async () => {
                playBtn.innerHTML = "▶";
                playBtn.classList.remove('is-pausing');
                controlsGroup.classList.remove('playing');
                if (document.fullscreenElement) document.exitFullscreen();

                btnFinish.disabled = false;
                btnFinish.classList.add("btn-active");
                btnFinish.innerHTML = "✨ ¡Completar Sesión!";

                // 🌟 LÓGICA DE LAS "BOLITAS": Enviamos el progreso a Firestore
                if (!videosVistos.has(index) && currentUserDocId) {
                    videosVistos.add(index); 
                    
                    let userProgress = currentUserData.progress || {};
                    let vidsVistosBaseDeDatos = userProgress[sesionId] || 0;
                    
                    let nuevoRecord = Math.max(vidsVistosBaseDeDatos, videosVistos.size);
                    
                    if (nuevoRecord > vidsVistosBaseDeDatos) {
                        userProgress[sesionId] = nuevoRecord;
                        currentUserData.progress = userProgress; 
                        
                        try {
                            await updateDoc(doc(db, "users", currentUserDocId), {
                                progress: userProgress
                            });
                        } catch (err) {
                            console.error("Error guardando historial de videos:", err);
                        }
                    }
                }
            });
        });
    }

    // --- 🌟 LÓGICA DE DESBLOQUEO CORREGIDA ---
    btnFinish.onclick = () => {
        let progress = parseInt(localStorage.getItem('prenatal_progress')) || 0;
        
        // Si acabas de terminar la Sesión 1, el nuevo progreso debe ser 2 (Para abrir el candado de la 2)
        if (sesionId >= progress) {
            localStorage.setItem('prenatal_progress', sesionId + 1);
        }
        
        window.location.href = "bienvenido.html";
    };

    loadData();
</script>
</body>
</html>
