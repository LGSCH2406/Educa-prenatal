<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Outfit',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:#6d0f1f;
  overflow:hidden;
  position:relative;
}

/* 🔥 CÍRCULOS DINÁMICOS */
.circle{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
}

.c1{width:500px;height:500px;top:-150px;left:-120px;animation:move1 12s infinite alternate ease-in-out;}
.c2{width:300px;height:300px;bottom:-100px;right:-100px;animation:move2 14s infinite alternate ease-in-out;}
.c3{width:200px;height:200px;top:40%;left:-80px;animation:move3 10s infinite alternate ease-in-out;}
.c4{width:180px;height:180px;top:20%;right:-80px;animation:move4 16s infinite alternate ease-in-out;}

@keyframes move1{to{transform:translate(60px,-60px);}}
@keyframes move2{to{transform:translate(-50px,-80px);}}
@keyframes move3{to{transform:translate(40px,-40px);}}
@keyframes move4{to{transform:translate(-30px,-60px);}}

/* ✨ PARTÍCULAS */
.particle{
  position:absolute;
  width:5px;
  height:5px;
  background:white;
  border-radius:50%;
  opacity:0.4;
  animation:particleMove 8s infinite linear;
}

.p1{top:20%;left:15%;}
.p2{top:70%;left:75%;}
.p3{top:50%;left:50%;}
.p4{top:80%;left:30%;}

@keyframes particleMove{
  to{transform:translateY(-120px);}
}

/* 🌊 ONDA */
.wave{
  position:absolute;
  width:150%;
  height:150px;
  bottom:0;
  left:-25%;
  background:rgba(255,255,255,0.05);
  border-radius:50%;
  animation:waveMove 12s infinite linear;
}

@keyframes waveMove{
  to{transform:translateX(40px);}
}

/* 📦 CARD */
.login-container{
  background:#fff;
  border-radius:20px;
  padding:40px 25px;
  width:100%;
  max-width:420px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
  z-index:2;
}

/* LOGO */
.logo{
  width:70%;
  max-width:250px;
  margin-bottom:20px;
  animation:floatLogo 4s infinite ease-in-out;
}

@keyframes floatLogo{
  50%{transform:translateY(-10px);}
}

/* TEXTOS */
.title{
  font-size:26px;
  color:#6d0f1f;
  margin-bottom:8px;
}

.subtitle{
  font-size:15px;
  color:#777;
  margin-bottom:25px;
}

/* INPUTS */
.input-group{
  position:relative;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}

label{
  position:absolute;
  top:14px;
  left:14px;
  color:#888;
  transition:.3s;
}

input:focus + label,
input:valid + label{
  top:-8px;
  font-size:11px;
  background:white;
  padding:0 5px;
  color:#6d0f1f;
}

/* 🔘 BOTÓN */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#6d0f1f;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
  font-weight:600;
}

button:hover{
  transform:scale(1.05);
}

button:active{
  transform:scale(0.95);
}

/* 🔄 LOADING */
button.loading{
  pointer-events:none;
  opacity:.7;
}

button.loading::after{
  content:"";
  width:18px;
  height:18px;
  border:3px solid white;
  border-top:3px solid transparent;
  border-radius:50%;
  display:inline-block;
  margin-left:10px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

.error{
  margin-top:12px;
  color:red;
  font-size:14px;
}

</style>
</head>

<body>

<!-- Fondo -->
<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>
<div class="circle c4"></div>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>

<div class="wave"></div>

<!-- LOGIN -->
<div class="login-container">

  <img src="logo.png" class="logo">

  <div class="title">Bienvenido</div>
  <div class="subtitle">Accede a tu plataforma de educación prenatal</div>

  <div class="input-group">
    <input type="text" id="usuario" required>
    <label>Usuario</label>
  </div>

  <div class="input-group">
    <input type="password" id="password" required>
    <label>Contraseña</label>
  </div>

  <button id="btn" onclick="login()">Ingresar</button>

  <div class="error" id="error"></div>

</div>

<script>
function login(){
  const btn = document.getElementById("btn");
  const user = document.getElementById("usuario").value;
  const pass = document.getElementById("password").value;

  btn.classList.add("loading");

  setTimeout(() => {
    if(user === "admin" && pass === "1234"){
      alert("Bienvenido");
    } else {
      document.getElementById("error").innerText = "Credenciales incorrectas";
    }
    btn.classList.remove("loading");
  }, 1200);
}
</script>

</body>
</html>
