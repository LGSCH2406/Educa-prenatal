<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educa-prenatal | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #6d0f1f;
            overflow: hidden;
            position: relative;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .c1 {
            width: 500px;
            height: 500px;
            top: -150px;
            left: -120px;
            animation: move1 12s infinite alternate ease-in-out;
        }

        .c2 {
            width: 300px;
            height: 300px;
            bottom: -100px;
            right: -100px;
            animation: move2 14s infinite alternate ease-in-out;
        }

        @keyframes move1 {
            to { transform: translate(60px, -60px); }
        }

        @keyframes move2 {
            to { transform: translate(-50px, -80px); }
        }

        .login-container {
            background: #fff;
            border-radius: 20px;
            padding: 40px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .logo {
            width: 70%;
            max-width: 250px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 26px;
            color: #6d0f1f;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 15px;
            outline: none;
        }

        #password {
            padding-right: 45px;
        }

        label {
            position: absolute;
            top: 14px;
            left: 14px;
            color: #888;
            transition: .3s;
            pointer-events: none;
        }

        input:focus+label,
        input:valid+label {
            top: -8px;
            font-size: 11px;
            background: white;
            padding: 0 5px;
            color: #6d0f1f;
        }

        #togglePassword {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #888;
            font-size: 1.2rem;
            z-index: 10;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6d0f1f;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: .2s;
            font-weight: 600;
        }

        button:hover {
            transform: scale(1.02);
            background: #8a1428;
        }

        .error {
            margin-top: 12px;
            color: red;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="login-container">
        <img src="logo.png" class="logo" alt="Logo">
        <div class="title">Bienvenida</div>
        <div class="subtitle">Accede a tu plataforma de educación prenatal</div>

        <div class="input-group">
            <input type="text" id="usuario" required>
            <label>Código de usuario (Ej: GS001)</label>
        </div>

        <div class="input-group">
            <input type="password" id="password" required>
            <label>Contraseña</label>
            <i class="bi bi-eye-slash" id="togglePassword"></i>
        </div>

        <button id="btn">Ingresar</button>
        <div class="error" id="error"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQXNj667woEMLUphhlHCAFeoAhEY0IuNM",
            authDomain: "educa-prenatal.firebaseapp.com",
            projectId: "educa-prenatal",
            storageBucket: "educa-prenatal.firebasestorage.app",
            messagingSenderId: "474992751698",
            appId: "1:474992751698:web:f313f8fdef5ff266a45b8b8",
            measurementId: "G-CLSR2LDM41"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const passwordInput = document.getElementById('password');
        const usuarioInput = document.getElementById('usuario');
        const togglePassword = document.getElementById('togglePassword');
        const btn = document.getElementById("btn");

        const iniciarSesion = async () => {
            const inputUsuario = usuarioInput.value.trim().toLowerCase();
            const pass = passwordInput.value;
            const errorDiv = document.getElementById("error");

            if (!inputUsuario || !pass) return;

            btn.disabled = true;
            btn.innerText = "Validando...";
            errorDiv.innerText = "";

            const emailFinal = inputUsuario.includes('@') ? inputUsuario : inputUsuario + "@gmail.com";

            try {
                // 1. Autenticación en Firebase Auth[cite: 2]
                const userCredential = await signInWithEmailAndPassword(auth, emailFinal, pass);
                const user = userCredential.user;
                const emailLogueado = user.email.toLowerCase();

                // Lógica de Administradores[cite: 2]
               // ... dentro de iniciarSesion en index.html ...

// Lógica de Administradores
                const admins = ["gus24060102@gmail.com", "maryjesmith@gmail.com"];
                if (admins.includes(emailLogueado)) {
                    // GUARDAR INFO DEL ADMIN ANTES DE REDIRIGIR
                    let adminName = emailLogueado === "gus24060102@gmail.com" ? "Gustavo Saldaña" : "Maryllini Ayala";
                    localStorage.setItem("adminName", adminName);
                    localStorage.setItem("adminEmail", emailLogueado);
                    
                    window.location.href = "admin.html";
                    return;
                }

                // 2. Verificación en Firestore[cite: 2]
                const q = query(collection(db, "users"), where("uid", "==", user.uid));
                const querySnapshot = await getDocs(q);

                // CORRECCIÓN: Si el documento no existe (usuario eliminado en admin.html)[cite: 1, 2]
                if (querySnapshot.empty) {
                    await signOut(auth); // Cerramos sesión inmediatamente[cite: 2]
                    btn.disabled = false;
                    btn.innerText = "Ingresar";
                    return Swal.fire({
                        icon: 'error',
                        title: 'Acceso denegado',
                        text: 'Esta cuenta ya no está registrada en el sistema.',
                        confirmButtonColor: '#6d0f1f'
                    });
                }

                // Si existe, verificamos si está inhabilitada[cite: 2]
                const userData = querySnapshot.docs[0].data();
                if (userData.active === false) {
                    await signOut(auth);
                    btn.disabled = false;
                    btn.innerText = "Ingresar";
                    return Swal.fire({
                        icon: 'error',
                        title: 'Cuenta Inhabilitada',
                        text: 'Tu acceso ha sido restringido por el administrador.',
                        confirmButtonColor: '#6d0f1f'
                    });
                }

                // 3. Todo correcto, entra a la plataforma[cite: 2]
                window.location.href = "bienvenido.html";

            } catch (error) {
                console.error("Error:", error);
                errorDiv.innerText = "Código o contraseña incorrectos.";
                btn.disabled = false;
                btn.innerText = "Ingresar";
            }
        };

        btn.addEventListener("click", iniciarSesion);

        const manejarEnter = (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                iniciarSesion();
            }
        };

        usuarioInput.addEventListener("keypress", manejarEnter);
        passwordInput.addEventListener("keypress", manejarEnter);

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });
    </script>
</body>
</html>
